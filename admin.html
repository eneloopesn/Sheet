<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>烤食煮盒｜後台訂單</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>烤食煮盒 · 後台</strong>
      <span>跨裝置即時共用訂單</span>
    </div>
    <nav class="nav-links">
      <a href="index.html">前台點餐</a>
      <button class="btn btn-ghost" id="refresh-btn" type="button">重新整理</button>
    </nav>
  </header>

  <main class="layout">
    <section class="hero">
      <h1>訂單管理</h1>
      <p>設定 Firebase 後，手機／電腦／平板會自動看到同一份訂單，並即時更新狀態。</p>
    </section>

    <div id="sync-banner" class="sync-banner loading">檢查同步狀態…</div>
    <div class="stats" id="stats"></div>

    <div class="admin-toolbar panel">
      <div class="filters" id="filters"></div>
      <div style="display:flex;flex-wrap:wrap;gap:0.45rem;align-items:center;">
        <button class="btn btn-ghost" id="export-btn" type="button">匯出 JSON</button>
        <label class="btn btn-ghost" style="cursor:pointer;margin:0;">
          匯入 JSON
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </label>
        <button class="btn btn-danger" id="clear-btn" type="button">清空訂單</button>
        <span style="color:var(--muted);font-size:0.9rem;">
          更新：<span id="last-updated">—</span>
        </span>
      </div>
    </div>

    <section class="orders" id="orders-root">
      <div class="empty">載入中…</div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync-banner.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
