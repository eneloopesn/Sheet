      <p class="bento-note">
        每份飯盒包含：精選主餐 ×1、特級白米飯 ×1、時令小菜 ×4、炒青菜 ×1。白飯可加飯服務。
      </p>

      <div class="order-layout" id="menu">
        <section>
          <div class="section-head">
            <div>
              <h2>菜單</h2>
              <p>招牌飯盒、特別餐點、人氣單點</p>
            </div>
          </div>
          <div class="filters" id="filters"></div>
          <div class="menu-grid" id="menu-grid"></div>
        </section>

        <aside class="cart-panel" id="cart">
          <h2>你的訂單</h2>
          <p class="hint">確認品項後送出；需詢價／預約品項請直接聯繫店家</p>
          <div class="cart-list" id="cart-list"></div>
          <div class="cart-total">
            <span>合計</span>
            <strong id="cart-total">$0</strong>
          </div>
          <div class="field">
            <label for="customerName">姓名 / 暱稱 *</label>
            <input id="customerName" type="text" maxlength="40" placeholder="例如：小美" />
          </div>
          <button class="btn btn-primary" id="submit-order" style="width: 100%">送出訂單</button>
        </aside>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="js/menu.js"></script>
