<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>烤食煮盒｜線上點餐</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>烤食煮盒</strong>
      <span>Roast & Cook · 線上點餐</span>
    </div>
    <nav class="nav-links">
      <a href="admin.html">後台訂單</a>
    </nav>
  </header>

  <main class="layout">
    <section class="hero">
      <h1>今日想吃哪一盒？</h1>
      <p id="restaurant-note">每盒含主餐、白飯、時令配菜四樣、炒物一樣，另有加購升飯服務。</p>
    </section>
    <div id="sync-banner" class="sync-banner loading">檢查同步狀態…</div>
    <div id="menu-root"></div>
  </main>

  <div class="cart-dock" id="cart-dock">
    <div>
      購物車 <strong id="cart-count">0</strong> 項 · 合計
      <strong id="cart-total">$0</strong>
    </div>
    <button class="btn btn-primary" id="open-cart-btn" type="button">查看／送出訂單</button>
  </div>

  <div class="modal-backdrop" id="cart-modal" role="dialog" aria-modal="true">
    <div class="modal">
      <h2>確認訂單</h2>
      <div class="cart-list" id="cart-list"></div>
      <div class="form-grid">
        <label>
          取餐姓名 *
          <input id="customer-name" type="text" placeholder="例如：小明" required />
        </label>
        <label>
          聯絡電話
          <input id="customer-phone" type="tel" placeholder="選填" />
        </label>
        <label>
          備註
          <textarea id="customer-note" rows="2" placeholder="例如：飯少、不要蔥"></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="close-cart-btn" type="button">繼續選餐</button>
        <button class="btn btn-primary" id="submit-order-btn" type="button">送出訂單</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync-banner.js"></script>
  <script src="js/order.js"></script>
</body>
</html>
