<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jabari簡易點餐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app"><!--
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>烤食煮盒</h1>
          <span class="brand-en">ROAST & COOK</span>
        </div>
      </div>
      <p class="tagline">主餐＋白飯＋小菜四樣＋炒蘿蔔乾｜右側即時看訂單</p>
    </header>-->

    <main class="layout">
      <section class="menu-panel" aria-labelledby="menu-title">
        <div class="panel-head">
          <h2 id="menu-title">菜單</h2>
          <p>依菜單分類點選品項加入購物車</p>
        </div>
        <div id="menu-list" class="menu-list"></div>
      </section>

      <aside class="cart-panel" aria-labelledby="cart-title">
        <div class="panel-head">
          <h2 id="cart-title">目前購物車</h2>
          <p>確認後送出訂單</p>
        </div>
        <ul id="cart-list" class="cart-list"></ul>
        <div class="cart-footer">
          <div class="cart-total">
            <span>合計</span>
            <strong id="cart-total">NT$ 0</strong>
          </div>
          <label class="note-field">
            <span>訂購人</span>
            <input id="order-note" type="text" placeholder="例如：王小明" maxlength="60" />
          </label>
          <button id="submit-order" class="btn-primary" type="button">送出訂單</button>
          <button id="clear-cart" class="btn-ghost" type="button">清空購物車</button>
        </div>
      </aside>

      <aside class="orders-panel" aria-labelledby="orders-title">
        <div class="panel-head">
          <h2 id="orders-title">訂單紀錄</h2>
          <p>所有已送出的訂單</p>
        </div>
        <div id="orders-list" class="orders-list"></div>
        <button id="clear-orders" class="btn-ghost btn-danger" type="button">清除全部紀錄</button>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
