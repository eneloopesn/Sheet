<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>伽苑瑜伽律動生活館</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2e28;
      --moss: #3d5c4f;
      --sage: #7a9a88;
      --mist: #e8f0ec;
      --sand: #f7f3ee;
      --clay: #c4a484;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Zen Kaku Gothic New", sans-serif;
      color: var(--ink);
      background: var(--sand);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* —— Hero —— */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem clamp(1.25rem, 4vw, 4rem) clamp(3rem, 8vh, 5rem);
      color: var(--white);
      isolation: isolate;
    }

    .hero__bg {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(
          165deg,
          rgba(26, 46, 40, 0.55) 0%,
          rgba(26, 46, 40, 0.25) 45%,
          rgba(26, 46, 40, 0.7) 100%
        ),
        url("https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=1920&q=80")
          center / cover no-repeat;
      animation: hero-breathe 18s ease-in-out infinite alternate;
    }

    .hero__grain {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .hero__brand {
      font-family: "Noto Serif TC", serif;
      font-size: clamp(2.75rem, 8vw, 5.5rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
      opacity: 0;
      animation: rise-in 1s ease 0.2s forwards;
    }

    .hero__headline {
      font-family: "Noto Serif TC", serif;
      font-size: clamp(1.15rem, 2.5vw, 1.5rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: rise-in 1s ease 0.45s forwards;
    }

    .hero__lead {
      max-width: 28rem;
      font-size: clamp(0.95rem, 1.8vw, 1.05rem);
      font-weight: 400;
      opacity: 0;
      color: rgba(255, 255, 255, 0.88);
      margin-bottom: 1.75rem;
      animation: rise-in 1s ease 0.65s forwards;
    }

    .hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      background: var(--white);
      color: var(--ink);
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.06em;
      font-size: 0.95rem;
      transition: background 0.3s ease, transform 0.3s ease;
      opacity: 0;
      animation: rise-in 1s ease 0.85s forwards;
    }

    .hero__cta:hover {
      background: var(--mist);
      transform: translateY(-2px);
    }

    .hero__cta svg {
      width: 1rem;
      height: 1rem;
      transition: transform 0.3s ease;
    }

    .hero__cta:hover svg {
      transform: translateX(3px);
    }

    /* —— About —— */
    .about {
      padding: clamp(4rem, 10vh, 7rem) clamp(1.25rem, 4vw, 4rem);
      background:
        radial-gradient(ellipse at 10% 20%, rgba(122, 154, 136, 0.18), transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(196, 164, 132, 0.15), transparent 45%),
        var(--sand);
    }

    .about__inner {
      max-width: 40rem;
      margin: 0 auto;
      text-align: center;
    }

    .about h2 {
      font-family: "Noto Serif TC", serif;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      color: var(--moss);
    }

    .about p {
      font-size: 1.05rem;
      color: var(--ink);
      opacity: 0.85;
    }

    .about__link {
      display: inline-block;
      margin-top: 2rem;
      color: var(--moss);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-underline-offset: 0.35em;
      transition: color 0.25s ease;
    }

    .about__link:hover {
      color: var(--ink);
    }

    /* —— Footer —— */
    footer {
      padding: 2rem clamp(1.25rem, 4vw, 4rem);
      text-align: center;
      font-size: 0.85rem;
      color: var(--sage);
      background: var(--ink);
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(1.25rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes hero-breathe {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.06);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__bg,
      .hero__brand,
      .hero__headline,
      .hero__lead,
      .hero__cta {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="hero__grain" aria-hidden="true"></div>

    <h1 class="hero__brand">伽苑</h1>
    <p class="hero__headline">瑜伽律動生活館</p>
    <p class="hero__lead">在呼吸與伸展之間，找回身體的節奏與日常的平靜。</p>
    <a
      class="hero__cta"
      href="http://localhost:3000"
      target="_blank"
      rel="noopener noreferrer"
    >
      前往 伽苑瑜伽律動生活館
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </header>

  <section class="about">
    <div class="about__inner">
      <h2>關於我們</h2>
      <p>
        伽苑瑜伽律動生活館位於基隆仁愛區，提供多元瑜珈課程與律動體驗，
        陪伴你在忙碌生活中，留下一段專屬於自己的靜心時光。
      </p>
      <a
        class="about__link"
        href="https://www.google.com.tw"
        target="_blank"
        rel="noopener noreferrer"
      >
        更多資訊請見 Google →
      </a>
    </div>
  </section>

  <footer>
    <p>© 伽苑瑜伽律動生活館</p>
  </footer>
</body>
</html>
